services:
  postgres:
    image: postgres:16-alpine
    container_name: dogeland_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dogeland
      POSTGRES_USER: dogeland
      POSTGRES_PASSWORD: dogeland_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogeland"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dogeland_redis
    restart: unless-stopped
    command: redis-server --requirepass dogeland_redis_dev --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dogeland_redis_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AuthMe MySQL (mock cho dev — simulate Minecraft server DB)
  mysql:
    image: mysql:8.0
    container_name: dogeland_authme_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: authme
      MYSQL_USER: authme
      MYSQL_PASSWORD: authme_dev_password
      MYSQL_ROOT_PASSWORD: authme_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "authme", "-pauthme_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  mysql_data:
