services:
  postgres:
    image: postgres:16-alpine
    container_name: dogeland_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-dogeland}
      POSTGRES_USER: ${DB_USER:-dogeland}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dogeland}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: dogeland_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-dogeland/dogeland}/api:latest
    container_name: dogeland_api
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER:-dogeland}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-dogeland}
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.dogeland.vn`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=4000"

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-dogeland/dogeland}/web:latest
    container_name: dogeland_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://api.dogeland.vn/api/v1
      NEXT_PUBLIC_APP_URL: https://dogeland.vn
    depends_on:
      - api
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`dogeland.vn`) || Host(`www.dogeland.vn`)"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3
    container_name: dogeland_traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - proxy

volumes:
  postgres_data:
  redis_data:
  letsencrypt_data:

networks:
  internal:
    internal: true
  proxy:
    external: false
